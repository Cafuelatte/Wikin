<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>アモアス MOD役職Wiki</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 完全にMarkdownだけでおしゃれな開閉メニューを作るためのベース -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <style>
    /* GitHubのダサいアコーディオンをスタイリッシュに変える魔法のCSS */
    .markdown-section details {
      background: #1e1e24;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      margin-bottom: 12px;
      padding: 16px;
      transition: all 0.3s ease;
    }
    .markdown-section details[open] {
      border-color: #f43f5e; /* 開いている時の枠線の色 */
    }
    .markdown-section summary {
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      outline: none;
      list-style: none; /* デフォルトのダサい三角を消す */
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    /* 右側に綺麗な矢印をつける */
    .markdown-section summary::after {
      content: '▼';
      font-size: 0.9rem;
      color: #a1a1aa;
      transition: transform 0.2s;
    }
    .markdown-section details[open] summary::after {
      content: '▲';
      color: #f43f5e;
    }
    /* 中身のテキストの見た目 */
    .markdown-section details ul {
      margin-top: 12px;
      padding-left: 20px;
      color: #e4e4e7;
    }
    /* 邪魔なサイドバーとヘッダーを完全に消し去る */
    .sidebar, .sidebar-toggle { display: none !important; }
    .content { left: 0 !important; width: 100% !important; position: static !important; padding-top: 20px !important; }
    body { background-color: #111115 !important; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      homepage: 'README.md', // メイン画面にREADME.mdを表示する
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
